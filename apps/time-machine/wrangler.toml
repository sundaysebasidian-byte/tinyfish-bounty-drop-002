name = "tinyfish-time-machine"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8f236662adb381d7fc8ef1e68d93d0af"
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
[[d1_databases]]
binding = "DB"
database_name = "tinyfish-time-machine"
database_id = "ad784a6a-28b1-4c7d-8699-ff091a3114ba"
[[kv_namespaces]]
binding = "BLOBS"
id = "91c929d3110d4706b87b8e8c8e10250c"
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]
[triggers]
crons = ["*/10 * * * *"]
[vars]
PAID_CALLS_ENABLED = "true"
PUBLIC_BASE_URL = "https://tinyfish-time-machine.sundaysebasidian.workers.dev"
STOP_AT_USD = "3.20"
MONITOR_END = "2026-11-18T07:59:00Z"
