<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TinyVerify · Official registry checks</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand">TinyVerify<span>●</span></a>
      <nav>
        <a href="/registries">Coverage</a><a href="/api/registries">JSON API</a>
      </nav>
    </header>
    <main id="main">
      <section>
        <p class="eyebrow">OFFICIAL SOURCES · SOURCE-LINKED RECEIPTS</p>
        <h1>Check the record.</h1>
        <form id="search">
          <label for="name">Name or registration number</label
          ><input
            id="name"
            name="name"
            placeholder="Business name, NPI, LEI, company or ABN number"
            required
            minlength="2"
            maxlength="150"
          />
          <div class="filters">
            <label
              >Entity<select name="kind">
                <option value="organisation">Organisation</option>
                <option value="person">Person · NPI only</option>
              </select></label
            ><label
              >Record type<select name="record_type">
                <option value="any">All supported records</option>
                <option value="company_registration">
                  Company registration
                </option>
                <option value="healthcare_registration">
                  Healthcare registration
                </option>
                <option value="broker_registration">Broker registration</option>
                <option value="bank_registration">Bank registration</option>
                <option value="lei_registration">LEI registration</option>
                <option value="business_registration">
                  ABN registration · number required
                </option>
                <option value="charity_registration">
                  Charity registration · number required
                </option>
              </select></label
            ><label
              >Jurisdiction<select name="jurisdiction">
                <option value="Global">All jurisdictions</option>
                <option value="US">United States</option>
                <option value="UK">United Kingdom</option>
                <option value="AU">Australia</option>
              </select></label
            >
          </div>
          <button type="submit">Verify record <span>↗</span></button>
        </form>
        <p class="muted">
          Try <button class="text" data-example="00445790">TESCO PLC</button> ·
          <button class="text" data-example="HWUPKR0MPOU8FGXBT394">
            Apple LEI
          </button>
          ·
          <button class="text" data-example="51824753556">
            Australian Taxation Office
          </button>
        </p>
      </section>
      <section id="results" aria-live="polite"></section>
    </main>
    <footer>
      Registry evidence, not a hiring recommendation. Unknown fields stay
      unknown.<br />Paid Agent and Monitor creation require an administrator
      token.
    </footer>
  </body>
</html>
